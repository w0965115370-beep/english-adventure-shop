<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d2b3a">
<title>English Adventure Shop</title>
<style>
:root{
  --ink:#2b1d12; --panel:#f4e9d0; --panel2:#e8d9b5; --border:#5a3b22; --accent:#3f8f4f; --accent-dark:#1f4f2a;
  --gold:#e8b830; --bad:#c0392b; --good:#2e8b47; --muted:#7a6a55;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2b3a;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#world{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

/* HUD */
#hud{position:fixed;top:calc(8px + var(--sat));left:calc(8px + var(--sal));display:flex;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none}
.hud-box{background:#1d2b3acc;color:#fff4dc;border:2px solid #0d1620;border-radius:6px;padding:4px 10px;font-weight:bold;font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.hud-box img{width:20px;height:20px;image-rendering:pixelated}
#objective{position:fixed;top:calc(52px + var(--sat));left:calc(8px + var(--sal));max-width:min(420px,60vw);background:#f4e9d0ee;
  border:3px solid var(--border);border-radius:6px;padding:6px 10px;font-size:15px;font-weight:bold;z-index:5;pointer-events:none;line-height:1.35}
#objective small{display:block;color:var(--muted);font-size:12px}
.say-bub{position:fixed;left:0;top:0;z-index:4;pointer-events:none;background:#fffaf0;color:#2b1d12;border:2px solid #2b1d12;border-radius:10px;padding:2px 9px;font-size:15px;font-weight:bold;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 2px 0 #0004}
.say-bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-5px;border:5px solid transparent;border-top-color:#2b1d12;border-bottom:0}
.say-bub.animal{background:#ffe9e4;border-color:#a0281c}
#alarm{position:fixed;inset:0;z-index:3;pointer-events:none;border:8px solid #e0281c;animation:alarm 1s infinite}
@keyframes alarm{0%,100%{opacity:.85}50%{opacity:.15}}
#objective.raid{background:#ffe1dc;border-color:#a0281c}
#objective .ob-hint{display:block;margin-top:3px;color:#7a4a1a;font-size:14px;font-weight:normal}
.help-step{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:17px;line-height:1.45}
.help-step b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#2b1d14;display:flex;align-items:center;justify-content:center}
.help-dots{text-align:center;color:var(--muted);margin-top:6px}
#menu-btns{position:fixed;top:calc(8px + var(--sat));right:calc(8px + var(--sar));display:flex;gap:6px;z-index:5}
#menu-btns button{min-width:64px;height:48px;padding:0 10px;font-size:16px;font-weight:bold;background:var(--panel);border:3px solid var(--border);border-radius:6px;box-shadow:0 3px 0 #0006}
#menu-btns button:active{transform:translateY(2px);box-shadow:0 1px 0 #0006}

/* 觸控操作 */
#joy-zone{position:fixed;left:0;bottom:0;width:42vw;height:58vh;z-index:4}
#joy-base.idle{opacity:.45}
#btn-a:not(.dim){animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #0007,0 0 0 0 #ffe08a00}50%{box-shadow:0 5px 0 #0007,0 0 0 8px #ffe08a88}}
#joy-base{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:#ffffff22;border:3px solid #ffffff55;
  left:calc(100px + var(--sal));top:calc(100% - 100px - var(--sab))}
#joy-knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:#f4e9d0dd;border:3px solid var(--border)}
#btn-a{position:fixed;right:calc(28px + var(--sar));bottom:calc(32px + var(--sab));width:104px;height:104px;border-radius:50%;z-index:5;
  background:var(--accent);color:#fff;border:4px solid var(--accent-dark);font-size:20px;font-weight:bold;box-shadow:0 5px 0 #0007;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
#btn-a.dim{background:#6b7a6e;border-color:#3d4a40;opacity:.75}
#btn-a:active{transform:translateY(3px);box-shadow:0 2px 0 #0007}

/* 提示 */
#toasts{position:fixed;left:50%;top:calc(60px + var(--sat));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:8;pointer-events:none}
.toast{background:#1d2b3aee;color:#fff4dc;border:2px solid #f4e9d0;border-radius:6px;padding:6px 14px;font-size:17px;font-weight:bold;animation:toast 2.6s forwards;white-space:nowrap}
.toast.good{border-color:#7ed39a}.toast.gold{border-color:var(--gold);color:#ffe9a8}.toast.bad{border-color:#ff9a8a}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* 視窗 */
#modal{position:fixed;inset:0;background:#0008;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sat)) calc(12px + var(--sar)) calc(12px + var(--sab)) calc(12px + var(--sal))}
#modal-box{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--panel);border:4px solid var(--border);border-radius:8px;box-shadow:0 6px 0 #0007;padding:18px 20px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#modal-box h2{margin:0 0 12px;font-size:22px}
#modal-box h3{margin:16px 0 8px;font-size:18px}
.speaker{display:inline-block;background:var(--border);color:#fff4dc;padding:2px 10px;border-radius:4px;font-weight:bold;margin-bottom:8px}
.say{font-size:20px;line-height:1.6;margin:0 0 14px;white-space:pre-line}
.btn{min-height:52px;padding:8px 16px;font-size:18px;font-weight:bold;background:var(--accent);color:#fff;border:3px solid var(--accent-dark);border-radius:6px;box-shadow:0 3px 0 #0005}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0005}
.btn:disabled{background:#9a9a8a;border-color:#6a6a5a;opacity:.7}
.btn.alt{background:#8a7a66;border-color:#4d4237}
.btn.small{min-height:40px;padding:4px 12px;font-size:16px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.close-x{float:right;min-width:48px;min-height:44px;font-size:18px;font-weight:bold;background:var(--panel2);border:3px solid var(--border);border-radius:6px}

/* 英文挑戰 */
.q-tag{display:inline-block;background:var(--gold);color:var(--ink);font-weight:bold;padding:2px 10px;border-radius:4px;font-size:15px}
.q-prompt{font-size:44px;font-weight:bold;text-align:center;margin:14px 0 6px;word-break:break-word}
.q-sub{text-align:center;color:var(--muted);margin-bottom:14px;font-size:16px}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.q-opt{min-height:72px;font-size:26px;font-weight:bold;background:#fffaf0;border:4px solid var(--border);border-radius:8px;box-shadow:0 4px 0 #0005;padding:6px;word-break:break-word}
.q-opt.right{background:#bff0c8;border-color:var(--good)}
.q-opt.wrong{background:#ffd0c8;border-color:var(--bad)}
.q-opt:disabled{color:var(--ink)}
.q-feedback{min-height:32px;text-align:center;font-size:22px;font-weight:bold;margin-top:12px}
.speak{min-height:44px;padding:4px 14px;font-size:16px;font-weight:bold;background:var(--panel2);border:3px solid var(--border);border-radius:6px}

/* 清單 */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:#fffaf0;border:2px solid #c9b48c;border-radius:6px;padding:8px 10px}
.row img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:bold;font-size:18px}
.row .d{font-size:14px;color:var(--muted)}
.bar{height:10px;background:#d8c9a8;border-radius:5px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--accent)}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.item-cell{display:flex;align-items:center;gap:8px;background:#fffaf0;border:3px solid #c9b48c;border-radius:6px;padding:8px;font-size:17px;font-weight:bold;min-height:56px}
.item-cell img{width:32px;height:32px;image-rendering:pixelated}
button.item-cell:active{border-color:var(--accent)}
.price-ctl{display:flex;align-items:center;gap:8px}
.price-ctl .btn{min-width:56px}
.price-val{min-width:120px;text-align:center;font-size:20px;font-weight:bold}
.stars{color:#d9a400;letter-spacing:1px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:16px}
label.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:18px;font-weight:bold;margin:12px 0}
label.setting input[type=range]{flex:1;max-width:260px;height:32px}
label.setting input[type=checkbox]{width:28px;height:28px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.swatch{width:48px;height:48px;border-radius:6px;border:4px solid #fff;box-shadow:0 0 0 2px var(--border)}
.swatch.on{border-color:var(--gold)}
.preview{display:block;margin:0 auto 12px;width:128px;height:128px;image-rendering:pixelated;background:#6aab4f;border:3px solid var(--border);border-radius:6px}

/* 標題畫面 */
#title{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(#5c9ad8 0 55%,#6aab4f 55% 100%)}
#title .card{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--panel);border:4px solid var(--border);border-radius:8px;box-shadow:0 8px 0 #0007;padding:0 0 16px;touch-action:pan-y}
#title-art{display:block;width:100%;aspect-ratio:160/64;image-rendering:pixelated;border-bottom:4px solid var(--border);border-radius:4px 4px 0 0}
#title .inner{padding:12px 20px 0}
#title h1{margin:0;text-align:center;font-size:28px;line-height:1.15;color:#7a3b1a;text-shadow:2px 2px 0 #f9d77e}
#title .sub{text-align:center;margin:2px 0 14px;color:var(--muted);font-weight:bold}
#title label{display:block;font-weight:bold;font-size:17px;margin-bottom:6px}
.seat-row{display:flex;gap:10px}
#seat{flex:1;min-width:0;font-size:28px;padding:8px 10px;text-align:center;border:3px solid var(--border);border-radius:6px;background:#fffaf0;-webkit-user-select:text;user-select:text}
#start-btn{flex:0 0 auto;min-width:140px;font-size:20px}
.name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.name-btn{min-height:68px;padding:6px 8px;font-size:24px;font-weight:bold;background:#fffaf0;border:3px solid var(--border);border-radius:8px;box-shadow:0 4px 0 #0005;line-height:1.2}
.name-btn small{display:block;font-size:12px;font-weight:normal;color:var(--muted)}
.name-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0005}
.name-btn:disabled{opacity:.5}
#seat-login{margin-top:12px}
#seat-login summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:bold;padding:4px 0}
#title-err{color:var(--bad);font-weight:bold;min-height:1.3em;margin-top:6px;font-size:15px}
#saves h4{margin:6px 0;font-size:14px;color:var(--muted)}
.save-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.save-chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;background:#fffaf0;border:3px solid #c9b48c;border-radius:6px;text-align:left;box-shadow:0 3px 0 #0003}
.save-chip:active{transform:translateY(2px);box-shadow:none}
.save-chip b{font-size:18px}
.save-chip span{font-size:13px;color:var(--muted)}
.title-foot{display:flex;gap:8px;margin-top:14px}
.title-foot .btn{flex:1}
#title .note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5}
.fishbar{position:relative;height:40px;background:#3f7fd0;border:3px solid var(--border);border-radius:6px;margin:14px 0;overflow:hidden}
.fishbar .zone{position:absolute;top:0;bottom:0;background:#5ac87a;border-left:2px solid #2e8b47;border-right:2px solid #2e8b47}
.fishbar .needle{position:absolute;top:-3px;bottom:-3px;width:8px;margin-left:-4px;background:#fff;border:2px solid #2b1d14;border-radius:2px}
table.words{width:100%;border-collapse:collapse;font-size:15px;background:#fffaf0}
table.words td,table.words th{border-bottom:1px solid #d8c9a8;padding:4px 6px;text-align:left}
.problem{color:var(--bad);font-size:15px;margin:4px 0}
ol.steps{padding-left:22px;line-height:1.7;font-size:16px;margin:6px 0}

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:7}
#fade.on{opacity:1}
@media (max-height:500px){
  .q-prompt{font-size:34px;margin:6px 0 2px}.q-opt{min-height:56px;font-size:22px}
  #btn-a{width:88px;height:88px}#joy-base{width:112px;height:112px;margin:-56px 0 0 -56px}
}

/* =====================================================================
   GBA 像素冒險風格介面（構圖參考 pixel-explore-edu-game）
   ‧ 所有視窗：白底＋深色外框＋藍綠色內框（雙框），字有淡灰陰影
   ‧ 對話：固定在畫面下方的長條對話框，名字牌在左上，選項在右側直列選單
   ‧ 主選單：右上直列選單，▶ 游標
   ‧ 狀態：左上單一狀態視窗；目標在下面
   ===================================================================== */
:root{
  --win:#f8f8f0; --win2:#e8f0e8; --win-line:#283038; --win-in:#70b0c8; --win-in2:#a8d8e0;
  --ink:#383838; --txt-sh:#d0d0c8; --muted:#707870; --cursor:#e05038;
  --accent:#4890d8; --accent-dark:#204870; --good:#30a050; --bad:#d03828; --gold:#f0c030;
  --panel:var(--win); --panel2:var(--win2); --border:var(--win-line);
}
html,body{background:#183028}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;letter-spacing:.5px}

/* 共用：GBA 雙框視窗 */
.gba-win,#modal-box,#objective,#hud,#menu-btns,#title .card,.toast{
  background:var(--win);color:var(--ink);border:3px solid var(--win-line);border-radius:8px;
  box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px var(--win-in),0 4px 0 #0006;
  text-shadow:1px 1px 0 var(--txt-sh)}

/* ---- 左上：狀態視窗 ---- */
#hud{flex-direction:column;flex-wrap:nowrap;gap:0;padding:8px 12px;min-width:150px}
#hud .hud-box{background:none;border:0;border-radius:0;padding:2px 0;color:var(--ink);font-size:16px;justify-content:space-between;gap:10px}
#hud .hud-box + .hud-box{border-top:2px dotted #b8c8c8}
#hud .hud-box:first-child{color:#8a5a00;font-size:18px}
#objective{top:auto;left:calc(8px + var(--sal));top:calc(8px + var(--sat) + var(--hud-h,96px));max-width:min(380px,56vw);padding:10px 14px 10px 14px;font-size:15px}
#objective small{color:var(--cursor);letter-spacing:2px;margin-bottom:2px}
#objective small::before{content:"▶ "}
#objective .ob-hint{color:#506070}
#objective.raid{background:#fff0ec;box-shadow:inset 0 0 0 3px #fff0ec,inset 0 0 0 5px #e07060,0 4px 0 #0006}

/* ---- 右上：直列主選單 ---- */
#menu-btns{flex-direction:column;gap:0;padding:8px 6px;min-width:118px}
#menu-btns button{position:relative;min-width:0;height:44px;padding:0 10px 0 26px;text-align:left;font-size:17px;background:none;border:0;border-radius:4px;box-shadow:none;text-shadow:inherit;color:var(--ink)}
#menu-btns button::before{content:"▶";position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--cursor);opacity:0}
#menu-btns button:hover::before,#menu-btns button:focus-visible::before,#menu-btns button:active::before{opacity:1}
#menu-btns button:active{transform:none;background:var(--win2);box-shadow:none}
#menu-btns .menu-logout{margin-top:4px;border-top:2px dotted #b8c8c8;border-radius:0;color:#a02010}

/* ---- 觸控：搖桿與 A 鍵（掌機按鍵風） ---- */
#joy-base{background:#28303855;border:3px solid #f8f8f088}
#joy-knob{background:#d8d8d0;border:3px solid var(--win-line);box-shadow:inset -3px -3px 0 #a8a8a0}
#btn-a{background:#c83850;border:4px solid #681828;color:#fff;text-shadow:2px 2px 0 #681828;box-shadow:inset -4px -5px 0 #901c34,0 5px 0 #0007}
#btn-a.dim{background:#888c90;border-color:#484c50;text-shadow:2px 2px 0 #484c50;box-shadow:inset -4px -5px 0 #686c70,0 5px 0 #0007}

/* ---- 提示：小視窗，從上方滑入 ---- */
.toast{padding:8px 16px;font-size:16px;border-radius:6px}
.toast.good{box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px #60c080,0 4px 0 #0006}
.toast.gold{color:#7a5000;box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px var(--gold),0 4px 0 #0006}
.toast.bad{color:#a02010;box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 5px #e07060,0 4px 0 #0006}
.say-bub{background:var(--win);border-color:var(--win-line);border-radius:6px;color:var(--ink)}

/* ---- 一般視窗（背包、任務、商店…） ---- */
#modal{background:#10181880}
#modal-box{padding:16px 20px 18px;border-radius:10px}
#modal-box h2{margin:-2px 0 12px;font-size:21px;padding:0 0 8px;border-bottom:3px solid var(--win-in2)}
#modal-box h2::before{content:"▶ ";color:var(--cursor);font-size:15px;vertical-align:2px}
#modal-box h3{font-size:17px;color:#406878}
.close-x{min-width:64px;min-height:40px;font-size:15px;background:var(--win2);border:2px solid var(--win-line);border-radius:6px;box-shadow:0 2px 0 #0004;text-shadow:none}
.close-x::before{content:"✕ "}

/* 按鈕：像素平塗，硬陰影 */
.btn{position:relative;border-radius:6px;border:3px solid var(--accent-dark);background:var(--accent);color:#fff;text-shadow:1px 1px 0 var(--accent-dark);box-shadow:inset -3px -3px 0 #2c6aa8,0 3px 0 #0005}
.btn.alt{background:var(--win2);color:var(--ink);border-color:var(--win-line);text-shadow:1px 1px 0 var(--txt-sh);box-shadow:inset -3px -3px 0 #c8d0c8,0 3px 0 #0005}
.btn:disabled{background:#c8c8c0;color:#888;border-color:#909090;text-shadow:none;box-shadow:none}
.btn:not(:disabled):hover::after,.btn:not(:disabled):focus-visible::after{content:"◀";position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.8}

/* 清單與格子 */
.row,.item-cell,.save-chip{background:#fff;border:2px solid #b8c8c8;border-radius:6px}
.bar{background:#d8e0d8;border:2px solid var(--win-line);height:12px;border-radius:3px}
.bar>i{background:linear-gradient(#78d878 0 50%,#48b048 50%)}
.price-val{background:#fff;border:2px solid #b8c8c8;border-radius:6px;padding:4px 0}
table.words{background:#fff}

/* ---- 對話：底部長條對話框（GBA 經典構圖） ---- */
#modal.dock{align-items:flex-end;background:transparent;padding-bottom:calc(10px + var(--sab))}
#modal.dock #modal-box{position:relative;width:min(900px,100%);overflow:visible;padding:22px 22px 16px;min-height:120px;margin-top:40px}
#modal.dock .speaker{position:absolute;left:14px;top:-20px;margin:0;background:var(--win);color:var(--ink);border:3px solid var(--win-line);border-radius:6px;padding:2px 14px;box-shadow:inset 0 0 0 2px var(--win),inset 0 0 0 4px var(--win-in)}
#modal.dock .say{font-size:21px;margin:0 0 8px;line-height:1.7;min-height:2.2em}
/* 只有「繼續／好」：變成右下角跳動的 ▼ */

<script>
"use strict";
/* =====================================================================
   ★★★ 老師設定區 ★★★

   單字平常在 Google 試算表裡修改（說明：遊戲登入畫面 →「老師專區」）。
   SHEET_URL：Google 試算表的網址（試算表要設為「知道連結的任何人都能檢視」），
              或「發布到網路」得到的 CSV 網址，貼在引號中間。

   下面的 CURRENT_UNIT 與 WORDS 是「備用單字」：
   還沒設定試算表、而且這台平板從來沒讀到過試算表時才會使用。
   ===================================================================== */
const SHEET_URL = "https://docs.google.com/spreadsheets/d/1N5J1G4KvrF7gepjn-a1Qc93G4R-N0f3S9HJbqMm0Kug/edit?gid=1877670129#gid=1877670129";

// 學生名單：[座號, 名字]。登入畫面會顯示名字按鈕，學生點自己的名字就能進入遊戲（存檔仍依座號）。

  [1, "泓萱"],
  [2, "真珣"],
  [3, "承毅"],
  [4, "亦凱"],
  [5, "妤彤"],
];

// 重置進度：這個時間（2026-11-04 11:21）以前建立的存檔，平板上和雲端的都不再讀取，大家從頭開始。
// 之後想再全部重置，把數字換成新的時間（毫秒）即可；設成 0 就是不重置。
const PROGRESS_RESET = 1793762477735;

const CURRENT_UNIT = "Unit 2";
const WORDS = [
  ["Unit 1", "apple",  "蘋果", "noun"],
  ["Unit 1", "banana", "香蕉", "noun"],
  ["Unit 1", "bread",  "麵包", "noun"],
  ["Unit 1", "milk",   "牛奶", "noun"],
  ["Unit 1", "egg",    "蛋",   "noun"],
  ["Unit 1", "juice",  "果汁", "noun"],
  ["Unit 1", "cake",   "蛋糕", "noun"],
  ["Unit 1", "water",  "水",   "noun"],
  ["Unit 2", "park",   "公園", "place"],

  ["Unit 2", "jump",   "跳",   "verb"],
  ["Unit 2", "swim",   "游泳", "verb"],

  ["Unit 2", "big",    "大的", "adj"],
];
/* ===================== 老師設定區結束，以下為遊戲程式 ===================== */

const SAVE_PREFIX = "eas1_save_";
const T = 16;                       // 地圖格大小（像素）
const MIN_PER_SEC = 1.2;            // 現實 1 秒 = 遊戲 1.2 分鐘 → 20 分鐘一天
const DAY = 1440;
const SHOP_OPEN = 7 * 60, SHOP_CLOSE = 21 * 60;
const QUESTION_COOLDOWN_MS = 25000;
const GATHER_QUESTION_CHANCE = 0.65;
const PRACTICE_PER_DAY = 3;
const MAX_SALES_PER_DAY = 60;
const CUSTOMER_GAP = () => randInt(12, 22);   // 每隔幾分鐘（遊戲時間）來一位顧客，約現實 10～18 秒

/* ---------------- 工具 ---------------- */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = Math.random;
const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function seeded(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = (s) => String(s).trim().toLowerCase().replace(/\s+/g, " ");

/* ---------------- 單字資料：Google 試算表 → 本機快取 → 備用單字 ---------------- */
const WORDS_CACHE_KEY = "eas1_words_cache";
let VOCAB = [];
let CURRENT_UNITS = new Set();
let wordSource = { kind: "builtin", at: 0, problems: [] };
// rows: [{unit, en, zh, pos, cur, line}]
function applyWordRows(rows) {
  const seen = new Map(), list = [], problems = [];
  for (const r of rows) {
    if (!r.unit && !r.en && !r.zh) continue;
    if (!r.unit || !r.en || !r.zh) { problems.push(`第 ${r.line} 行：單元、英文、中文要填完整（${[r.unit, r.en, r.zh].filter(Boolean).join(" / ") || "空白"}）`); continue; }
    const key = norm(r.en);
    if (seen.has(key)) { problems.push(`第 ${r.line} 行：「${r.en}」和第 ${seen.get(key)} 行重複，只使用第一個`); continue; }
    seen.set(key, r.line);
    list.push({ key, unit: r.unit, en: r.en, zh: r.zh, pos: r.pos || "other", cur: r.cur });
  }
  const zhSeen = new Map();
  for (const w of list) { const z = norm(w.zh); if (zhSeen.has(z)) problems.push(`「${w.en}」和「${zhSeen.get(z)}」的中文都是「${w.zh}」，這兩個字不會出現在同一題`); else zhSeen.set(z, w.en); }
  let cur = new Set(list.filter((w) => w.cur).map((w) => w.unit));
  if (!cur.size && list.length) cur = new Set([list[list.length - 1].unit]);
  const curCount = list.filter((w) => cur.has(w.unit)).length;
  if (list.length && list.length < 4) problems.push(`目前只有 ${list.length} 個單字，至少要 4 個才能出四選一的題目`);
  if (curCount && curCount < 3) problems.push(`本週單元只有 ${curCount} 個單字，建議至少 5 個`);
  VOCAB = list; CURRENT_UNITS = cur;
  return problems;
}
function builtinRows() { return WORDS.map((r, i) => ({ unit: String(r[0] ?? "").trim(), en: String(r[1] ?? "").trim(), zh: String(r[2] ?? "").trim(), pos: String(r[3] ?? "").trim(), cur: String(r[0] ?? "").trim() === CURRENT_UNIT, line: i + 1 })); }
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const CUR_MARK = /^(v|y|yes|x|1|是|本週|✓|✔|o|ｖ|Ｖ)$/i;
// cellRows：每列是一個字串陣列（第一列可以是標題列）
function rowsFromCells(cellRows, firstLine = 1) {
  const out = [];
  cellRows.forEach((cells, i) => {
    const c = cells.map((x) => String(x ?? "").trim());
    if (i === 0 && (/英文|english/i.test(c[1] || "") || /單元/.test(c[0] || ""))) return;   // 標題列
    out.push({ unit: c[0] || "", en: c[1] || "", zh: c[2] || "", cur: CUR_MARK.test(c[3] || ""), pos: "", line: i + firstLine });
  });
  return out;
}
const sheetRows = (csv) => rowsFromCells(parseCSV(csv));
// 解析試算表網址：一般分享網址 → {id, gid}；發布到網路的 CSV 網址 → {csv}
function sheetSource(url) {
  if (!url) return null;
  const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/);
  if (m && !/\/d\/e\//.test(url)) return { id: m[1], gid: (url.match(/[#&?]gid=(\d+)/) || [])[1] || "0" };
  return { csv: url };
}
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("連線逾時")), ms))]); }
async function fetchSheetCSV(url) {
  const res = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error(res.status === 401 || res.status === 403 || res.status === 404 ? "試算表沒有開放「知道連結的任何人都能檢視」" : "HTTP " + res.status);
  const text = await res.text();
  if (/<html/i.test(text.slice(0, 300))) throw new Error("試算表沒有開放「知道連結的任何人都能檢視」");
  return sheetRows(text);
}
// 備用方式：Google 的 JSONP 介面（直接在電腦上打開 HTML 檔時，一般讀取會被瀏覽器擋住）
let gvizSeq = 0;
function gvizTable(id, gid, tq = "") {
  return new Promise((resolve, reject) => {
    const cb = "__easSheet" + Date.now() + "_" + gvizSeq++;
    const s = document.createElement("script");
    const done = () => { delete window[cb]; s.remove(); };
    window[cb] = (resp) => {
      done();
      if (!resp || resp.status === "error" || !resp.table) return reject(new Error("試算表沒有開放「知道連結的任何人都能檢視」"));
      resolve(resp.table);
    };
    s.onerror = () => { done(); reject(new Error("讀不到試算表（請確認網路與分享設定）")); };
    s.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&gid=${gid}${tq ? "&tq=" + encodeURIComponent(tq) : ""}&t=${Date.now()}`;
    document.head.appendChild(s);
  });
}
async function fetchSheetJSONP(id, gid) {
  const t = await gvizTable(id, gid);
  const cells = t.rows.map((r) => (r.c || []).map((c) => (c && c.v != null ? String(c.v) : "")));
  const header = t.cols.map((c) => c.label || "");
  return header.some(Boolean) ? rowsFromCells([header, ...cells]) : rowsFromCells(cells);
}
async function fetchSheetRows() {
  const src = sheetSource(SHEET_URL);
  if (src.csv) return fetchSheetCSV(src.csv);
  if (location.protocol === "file:") return fetchSheetJSONP(src.id, src.gid);   // 本機檔案直接用備用方式
  try { return await fetchSheetCSV(`https://docs.google.com/spreadsheets/d/${src.id}/export?format=csv&gid=${src.gid}`); }
  catch (e) { return fetchSheetJSONP(src.id, src.gid); }
}
async function loadWords(force = false) {
  // 1) 先用快取或備用單字，讓遊戲一定能開始
  let cache = null;
  try { cache = JSON.parse(localStorage.getItem(WORDS_CACHE_KEY) || "null"); } catch { /* 無法讀取 */ }
  if (!force) {
    if (cache && cache.rows && cache.rows.length) { wordSource = { kind: "cache", at: cache.at, problems: applyWordRows(cache.rows) }; }
    else wordSource = { kind: "builtin", at: 0, problems: applyWordRows(builtinRows()) };
  }
  // 2) 有設定試算表就讀最新的
  if (!SHEET_URL) return wordSource;
  try {
    const rows = await withTimeout(fetchSheetRows(), 8000);
    const problems = applyWordRows(rows);
    if (!VOCAB.length) throw new Error("試算表裡沒有讀到任何單字");
    wordSource = { kind: "sheet", at: Date.now(), problems };
    try { localStorage.setItem(WORDS_CACHE_KEY, JSON.stringify({ at: Date.now(), rows })); } catch { /* 空間不足 */ }
  } catch (err) {
    if (cache && cache.rows && cache.rows.length) wordSource = { kind: "cache", at: cache.at, problems: applyWordRows(cache.rows), error: String(err.message || err) };
    else wordSource = { kind: "builtin", at: 0, problems: applyWordRows(builtinRows()), error: String(err.message || err) };
  }
  return wordSource;
}
const isCurrent = (w) => CURRENT_UNITS.has(w.unit);
const currentLabel = () => [...CURRENT_UNITS].join("、") || "（未設定）";

/* ---------------- 遊戲資料定義 ---------------- */
const ITEMS = {
  wood:     { zh: "木材", en: "wood",     price: 4 },
  berry:    { zh: "莓果", en: "berry",    price: 5 },
  flower:   { zh: "野花", en: "flower",   price: 6 },
  herb:     { zh: "草藥", en: "herb",     price: 8 },
  mushroom: { zh: "蘑菇", en: "mushroom", price: 12 },
  honey:    { zh: "蜂蜜", en: "honey",    price: 20 },
  fish:     { zh: "小魚", en: "fish",     price: 7 },
  bigfish:  { zh: "大魚", en: "big fish", price: 16 },
  carrot:     { zh: "胡蘿蔔", en: "carrot",     price: 10 },
  tomato:     { zh: "番茄",   en: "tomato",     price: 14 },
  strawberry: { zh: "草莓",   en: "strawberry", price: 16 },
  sunflower:  { zh: "向日葵", en: "sunflower",  price: 22 },
  pumpkin:    { zh: "南瓜",   en: "pumpkin",    price: 45 },
  jam:      { zh: "果醬", en: "jam",      price: 22, crafted: true },
  tomatosoup: { zh: "番茄湯",   en: "tomato soup",     price: 34, crafted: true },

function mk(w, h, fn) { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); fn(g); return c; }
function P(g, x, y, col, w = 1, h = 1) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function fromRows(rows, pal, mirror = false) {
  return mk(16, rows.length, (g) => rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) { const c = pal[r[x]]; if (c) P(g, mirror ? 15 - x : x, y, c); } }));
}
function circle(g, cx, cy, r, col) { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r + r * 0.6) P(g, cx + x, cy + y, col); }

function charSprite(look, dir, frame) {
  const girl = look.style === "girl";
  const k = `${look.hair}|${look.shirt}|${look.pants || ""}|${look.skin || ""}|${girl ? "g" : "b"}|${dir}|${frame}`;
  if (charCache.has(k)) return charCache.get(k);
  const pal = { O: "#2b1d14", H: look.hair, S: look.skin || "#f2c79b", E: "#2b1d14", T: look.shirt, P: look.pants || "#3b4a6b", B: "#4a3020", R: look.ribbon || "#e0284a" };
  const side = dir === "left" || dir === "right";
  const head = girl ? (dir === "up" ? CG_HEAD_UP : side ? CG_HEAD_SIDE : CG_HEAD_DOWN) : (dir === "up" ? CH_HEAD_UP : side ? CH_HEAD_SIDE : CH_HEAD_DOWN);
  const body = girl ? (dir === "up" ? CG_BODY_UP : side ? CG_BODY_SIDE : CG_BODY_FRONT) : (side ? CH_BODY_SIDE : CH_BODY_FRONT);
  const legs = (girl ? (side ? CG_LEGS_SIDE : CG_LEGS_FRONT) : (side ? CH_LEGS_SIDE : CH_LEGS_FRONT))[frame];
  const c = fromRows([...head, ...body, ...legs], pal, dir === "left");
  charCache.set(k, c);
  return c;

const TILE = { GRASS: 0, GRASS2: 1, PATH: 2, WATER: 3, TREE: 4, FENCE: 5, FLOOR: 6, WALL: 7, BRIDGE: 8, BROKEN: 9, DARK: 10, WALLTOP: 11, SAND: 12, PALMWALL: 13,
  CAVE: 14, CAVEWALL: 15, RAIL: 16, RAILBROKEN: 17, ROCK: 18 };
const SOLID_TILES = new Set([TILE.WATER, TILE.TREE, TILE.FENCE, TILE.WALL, TILE.BROKEN, TILE.WALLTOP, TILE.PALMWALL, TILE.CAVEWALL, TILE.RAILBROKEN, TILE.ROCK]);
const tileImgs = {};
function grassTile(base, dark, light, seed, flowers) {
  const r = seeded(seed);
  return mk(16, 16, (g) => {
    P(g, 0, 0, base, 16, 16);
    for (let i = 0; i < 14; i++) P(g, Math.floor(r() * 16), Math.floor(r() * 16), r() < 0.5 ? dark : light);
    for (let i = 0; i < 3; i++) { const x = Math.floor(r() * 14), y = Math.floor(r() * 13); P(g, x, y, dark); P(g, x + 1, y - 1 < 0 ? 0 : y - 1, dark); }
    if (flowers) for (let i = 0; i < 3; i++) { const x = 1 + Math.floor(r() * 13), y = 1 + Math.floor(r() * 13); P(g, x, y, r() < 0.5 ? "#f7e26b" : "#f4a3c4"); }
  });
}

  }));

function makeScene(name, w, h, fill) {

const tileAt = (sc, x, y) => (x < 0 || y < 0 || x >= sc.w || y >= sc.h) ? TILE.TREE : sc.tiles[y * sc.w + x];

}
function rebuildSolid(sc) {

  }
}

function recentWrongRate(s) { if (!s.rc) return 0.5; let wrong = 0; for (let i = 0; i < s.rc; i++) if (!((s.recent >> i) & 1)) wrong++; return wrong / s.rc; }
function pickWord() {
  if (!VOCAB.length) return null;
  let cur = VOCAB.filter(isCurrent), old = VOCAB.filter((w) => !isCurrent(w));
  if (!cur.length) { cur = VOCAB; old = []; }
  const avgM = cur.reduce((a, w) => a + wordStat(w.key).m, 0) / cur.length;
  const oldWeak = old.some((w) => recentWrongRate(wordStat(w.key)) > 0.5 && wordStat(w.key).rc > 0);
  let oldShare = old.length ? 0.2 : 0;
  if (old.length && (avgM >= 4 || oldWeak)) oldShare = 0.35;
  const group = rand() < oldShare ? old : cur;
  const now = Date.now();
  const weights = group.map((w) => {
    const s = wordStat(w.key);
    let wt = 1 + 2 * recentWrongRate(s);
    wt *= 1 + Math.min(1, (now - (s.last || 0)) / 86400000);
    if (S.recentQ.includes(w.key)) wt *= 0.1;
    if (!s.a) wt *= 1.5;
    return wt;
  });
  let r = rand() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < group.length; i++) { r -= weights[i]; if (r <= 0) return group[i]; }
  return group[group.length - 1];
}

  const seenShow = new Set([correctShow]);
  const cands = [];
  for (const o of shuffle(VOCAB.slice())) {

    cands.push({ o, pref });
  }
  // 熟悉度高：選同單元同詞性的干擾項（較難）；熟悉度低：隨機（較容易分辨）
  if (wordStat(word.key).m >= 3) cands.sort((a, b) => b.pref - a.pref);
  const distract = cands.slice(0, 3).map((c) => c.o);
  if (distract.length < 1) return null;   // 少於 2 個選項，不出題
  const options = shuffle([word, ...distract]);
  return { word, type: dir, prompt: dir === "en2zh" ? word.en : word.zh, options: options.map((o) => ({ key: o.key, text: show(o) })) };
}

function askQuestion(context, opts, cb) {

  const word = pickWord();

  const streak = S.streak >= 2 ? ` <span class="q-tag" style="background:#ff9a6a">連續答對 ${S.streak} 題</span>` : "";

    <div class="q-opts">${q.options.map((o, i) => `<button class="q-opt" data-act="o${i}">${esc(o.text)}</button>`).join("")}</div>
    <div class="q-feedback" id="q-fb"></div>`;

      Sound.sfx(ok ? "right" : "wrong");

  });

function recordAnswer(q, ok, context) {
  const s = wordStat(q.word.key);

  S.log.push({ t: Date.now(), k: q.word.key, d: q.type, ok, c: context });
  if (S.log.length > 400) S.log.splice(0, S.log.length - 400);
  if (ok) {

}

function ensureDaily() {
  const d = gameDay();
  if (S.daily && S.daily.day === d) return;
  const r = seeded(d * 97 + Number(S.seat) * 13 + 5);
  const pool = DAILY_POOL.filter((q) => !q.needStep || S.main.step >= q.needStep); const chosen = [];
  while (chosen.length < 3 && pool.length) { const i = Math.floor(r() * pool.length); const q = pool.splice(i, 1)[0]; if (!chosen.some((c) => c.ev === q.ev)) chosen.push(q); }
  S.daily = { day: d, list: chosen.map((q) => ({ id: q.id, p: 0, claimed: false })) };
  // 雜貨婆婆的英文訂單（每天一張）
  const avail = ["wood", "berry", "flower", "herb", "fish", "carrot", "tomato", "strawberry"];
  if (S.main.step >= 6) avail.push("jam", "bouquet");
  if (S.flags.bridge) avail.push("mushroom", "honey", "soup", "potion");
  if (S.flags.beach) avail.push("shell", "coconut");
  if (S.flags.mine) avail.push("coal", "iron", "lamp");
  const item = avail[Math.floor(r() * avail.length)];
  const n = ITEMS[item].crafted ? 1 + Math.floor(r() * 2) : 2 + Math.floor(r() * 3);
  S.order = { day: d, item, n, done: false };
  S.talkedToday = []; S.counters = { day: d, sales: 0 };
  markDirty();
}
function questEvent(ev, item, n = 1) {
  if (!S.daily) return;
  for (const dq of S.daily.list) {
    const def = DAILY_POOL.find((x) => x.id === dq.id);
    if (!def || def.ev !== ev || (def.item && def.item !== item) || dq.p >= def.n) continue;
    dq.p = Math.min(def.n, dq.p + n);
    if (dq.p >= def.n) toast(`每日任務完成：${def.text}（到任務領獎）`, "gold");
  }
  markDirty();
}
function giveReward(rw) {

}

}

/* ---- 拼字工作台：點字母排成正確的英文單字 ----
   第一次就拼對 → "correct"；拼錯可以再試一次（會提示第一個字母）；兩次都錯 → 顯示答案，回傳 "wrong"。
   不論對錯都會做出商品（材料不會白費），拼對有機會多做一個。 */
function spellChallenge(word, itemKey, cb) {
  const letters = word.split("");
  let tiles = shuffle(letters.map((ch, i) => ({ ch, i })));
  for (let k = 0; k < 5 && tiles.map((t) => t.ch).join("") === word && word.length > 1; k++) tiles = shuffle(tiles);
  let picked = [], tries = 0, locked = false, fb = "";
  const it = ITEMS[itemKey];
  const render = () => {
    const slots = letters.map((_, k) => {
      const t = picked[k] !== undefined ? tiles[picked[k]] : null;
      return `<span class="spell-slot${t ? " on" : ""}">${t ? esc(t.ch) : ""}</span>`;
    }).join("");
    const btns = tiles.map((t, k) => `<button class="spell-tile" data-act="t${k}" ${picked.includes(k) || locked ? "disabled" : ""}>${esc(t.ch)}</button>`).join("");
    const h = { say: () => speak(word, true), back: () => { if (!locked && picked.length) { picked.pop(); render(); } }, clear: () => { if (!locked) { picked = []; render(); } } };
    tiles.forEach((_, k) => { h["t" + k] = () => { if (locked || picked.includes(k)) return; picked.push(k); Sound.sfx("click"); if (picked.length === letters.length) check(); else render(); }; });
    openModal(`<span class="q-tag">拼字工作台</span><div class="spell-item"><img src="${icon(itemKey)}" alt=""><b>${esc(it.zh)}</b></div>
      <div class="q-sub">把字母排成正確的英文 <button class="speak" data-act="say">聽發音</button></div>
      <div class="spell-slots">${slots}</div>
      <div class="spell-tiles">${btns}</div>
      <div class="btn-row spell-ctl"><button class="btn alt small" data-act="back" ${locked || !picked.length ? "disabled" : ""}>退一格</button><button class="btn alt small" data-act="clear" ${locked || !picked.length ? "disabled" : ""}>重來</button></div>
      <div class="q-feedback">${fb}</div>`, h);
  };
  const check = () => {
    const ans = picked.map((k) => tiles[k].ch).join("");
    locked = true;
    if (ans === word) {
      fb = `<span style="color:var(--good)">拼對了！${esc(word)} ＝ ${esc(it.zh)}</span>`;
      render(); document.querySelectorAll(".spell-slot").forEach((el) => el.classList.add("ok"));
      Sound.sfx("right"); speak(word); if (tries === 0) questEvent("correct");
      return setTimeout(() => { closeModal(); cb(tries === 0 ? "correct" : "retry"); }, 1300);
    }
    tries++;
    Sound.sfx("wrong");
    if (tries < 2) {
      fb = `<span style="color:var(--bad)">不對喔，再試一次！提示：第一個字母是「${esc(word[0])}」</span>`;
      render(); document.querySelectorAll(".spell-slot").forEach((el) => el.classList.add("bad"));
      return setTimeout(() => { picked = []; locked = false; fb = `<span class="muted">提示：第一個字母是「${esc(word[0])}」</span>`; render(); }, 1100);
    }
    fb = `<span style="color:var(--bad)">正確答案：${esc(word.split("").join("-"))}（${esc(it.zh)}）</span>`;
    render(); document.querySelectorAll(".spell-slot").forEach((el) => el.classList.add("bad"));
    speak(word);
    setTimeout(() => { closeModal(); cb("wrong"); }, 2600);
  };
  render();
  if (S.settings.speak) speak(word);
}

/* ---- 農田：播種 → 澆水 → 長大（中途要再澆一次）→ 收成 ---- */
const emptyPlot = () => ({ c: null, g: 0, wet: false, dry: false });

const plotEnt = (i) => scenes.village.ents.find((e) => e.id === "plot" + i);
const cropReady = (p) => p.c && p.g >= CROPS[p.c].grow;

function growFarm(min) {
  S.farm.forEach((p, i) => {
    if (!p.c || !p.wet || !plotUnlocked(i)) return;
    const grow = CROPS[p.c].grow;
    if (p.g >= grow) return;
    const next = p.g + min;
    if (!p.dry && next >= grow / 2) { p.g = grow / 2; p.wet = false; p.dry = true; }   // 長到一半土乾了，要再澆一次
    else p.g = Math.min(grow, next);
  });
}

/* ---- 採集動作（揮斧頭、搖晃、碎屑） ---- */
let action = null, shakeT = 0;
function startAction(e, done) {
  const c = entCenter(e), dx = c.x - player.x, dy = c.y - (player.y - 6);
  player.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  const tree = e.kind === "tree" || e.kind === "hive" || e.kind === "palm", k = upVal("skill");
  action = { e, t: 0, dur: (tree ? 0.95 : 0.6) * k, step: (tree ? 0.32 : 0.2) * k, next: 0.12 * k, tree, done };
}
function updateAction(dt) {
  if (!action) return false;
  const a = action; a.t += dt;
  if (a.t >= a.next) {
    a.next += a.step;
    const c = entCenter(a.e);
    a.e.shake = 0.18;
    if (a.tree) { Sound.sfx("chop"); burst(c.x, c.y + 2, "#c9a06a"); burst(c.x, c.y - 8, "#58a85e"); shakeT = 0.08; }
    else { Sound.sfx("pick"); burst(c.x, c.y, a.e.kind === "bush" ? "#d23c5a" : "#7ac86a"); }
  }
  for (const e of scene.ents) if (e.shake > 0) e.shake -= dt;
  if (a.t >= a.dur) { action = null; a.done(); }
  return true;
}
function gather(e) {
  const def = NODE_KINDS[e.kind];
  if (action) return;
  if (!nodeReady(e)) { const h = Math.ceil((S.nodes[e.id] - S.min) / 60); return toast(`還沒長好，大約 ${h} 小時後再來`); }
  if (invCount() >= capacity()) return toast("背包滿了！回商店上架，或找工匠升級背包", "bad");
  startAction(e, () => doGather(e));
}
function doGather(e) {
  const def = NODE_KINDS[e.kind];
  let qty = randInt(def.min, def.max) + (def.noTool ? 0 : upVal("tool"));
  const finish = (res) => {
    if (res === "correct" && rand() < 0.25) qty++;
    if (res === "wrong") qty = Math.max(1, qty - 1);

/* ---------------- 商店：貨架、顧客 ---------------- */
const slotUnlocked = (i) => i < upVal("shelfSlots");
const TOO_EXPENSIVE = 1.5;   // 售價超過原價 1.5 倍 → 完全沒有人買
const tooExpensive = (price, base) => price / base > TOO_EXPENSIVE;
const buyChance = (price, base) => {
  const r = price / base;
  if (r > TOO_EXPENSIVE) return 0;
  if (r <= 1) return clamp(0.9 - 0.25 * (r - 0.5), 0.05, 0.95);   // 原價以下：很好賣
  return clamp(0.78 - 1.3 * (r - 1), 0.1, 0.95);                   // 比原價貴：越貴越難賣
};
function priceMood(price, base) { const r = price / base; return r > TOO_EXPENSIVE ? ["太貴了！完全賣不出去", "var(--bad)"] : r <= 0.8 ? ["便宜", "var(--good)"] : r <= 1.15 ? ["合理", "var(--ink)"] : ["偏貴", "var(--bad)"]; }
function openShelf(i, stage = null) {
  if (!slotUnlocked(i)) return toast("這格貨架還不能用，找工匠升級「貨架格數」");

      <div class="price-val">${price} 金<br><small style="color:${col}">${tooExpensive(price, base) ? `<b>${mood}</b>（0% 會買）` : `${mood}・約 ${Math.round(buyChance(price, base) * 100)}% 會買`}</small></div>
      <button class="btn small" data-act="pup">＋</button></div>`; };
  const nextPrice = (price, base, d) => clamp(Math.round(price + d * Math.max(1, Math.round(base * 0.1))), Math.ceil(base * 0.5), base * 2);
  const h = { __closable: true };
  if (stage) {
    // 第二步：選數量、定價，按「上架！」
    const it = ITEMS[stage.item], maxN = Math.min(cap, S.inv[stage.item] || 0);
    parts.push(`<div class="row"><img src="${icon(stage.item)}" alt=""><div class="grow"><div class="t">${it.zh} <span class="muted">${it.en}</span></div><div class="d">背包裡有 ${S.inv[stage.item] || 0} 個・原價 ${it.price} 金</div></div></div>
      <h3>數量</h3><div class="price-ctl"><button class="btn small" data-act="ndown" ${stage.n <= 1 ? "disabled" : ""}>－</button>
      <div class="price-val">${stage.n} 個<br><small>這格最多放 ${cap} 個</small></div>
      <button class="btn small" data-act="nup" ${stage.n >= maxN ? "disabled" : ""}>＋</button></div>
      ${priceBox(stage.price, it.price)}
      <div class="btn-row" style="margin-top:14px"><button class="btn alt" data-act="cancel">換別的</button><button class="btn" data-act="confirm">上架！</button></div>`);
    Object.assign(h, {
      ndown: () => openShelf(i, { ...stage, n: Math.max(1, stage.n - 1) }),
      nup: () => openShelf(i, { ...stage, n: Math.min(maxN, stage.n + 1) }),
      pdown: () => openShelf(i, { ...stage, price: nextPrice(stage.price, it.price, -1) }),
      pup: () => openShelf(i, { ...stage, price: nextPrice(stage.price, it.price, 1) }),
      cancel: () => openShelf(i),
      confirm: () => {

        sl.item = stage.item; sl.lastItem = stage.item; sl.qty = n; sl.price = stage.price; addItem(stage.item, -n);
        closeModal(); toast(`上架完成：${it.zh} ×${n}，一個 ${stage.price} 金`, "good"); if (tooExpensive(stage.price, it.price)) setTimeout(() => toast(`${it.zh}定價太高，不會有人買！把價格調低一點`, "bad"), 600); afterStock(); writeSave();
      },
    });
  } else if (sl.item && sl.qty > 0) {
    const it = ITEMS[sl.item];
    parts.push(`<div class="row"><img src="${icon(sl.item)}" alt=""><div class="grow"><div class="t">${it.zh} ×${sl.qty} <span class="muted">/ ${cap}</span></div><div class="d">原價 ${it.price} 金</div></div></div>
      ${priceBox(sl.price, it.price)}
      <div class="btn-row" style="margin-top:12px"><button class="btn alt" data-act="more" ${sl.qty >= cap || !(S.inv[sl.item] > 0) ? "disabled" : ""}>再放 1 個</button>
      <button class="btn alt" data-act="fill" ${sl.qty >= cap || !(S.inv[sl.item] > 0) ? "disabled" : ""}>放滿</button>
      <button class="btn alt" data-act="back">全部收回背包</button></div>
      <div class="btn-row" style="margin-top:10px"><button class="btn" data-act="done">好了，回去賣東西</button></div>`);
    const put = (n) => { const add = Math.min(n, cap - sl.qty, S.inv[sl.item] || 0); if (add <= 0) return; sl.qty += add; addItem(sl.item, -add); afterStock(); openShelf(i); };
    Object.assign(h, {

      more: () => put(1), fill: () => put(cap),

  }
  openModal(parts.join(""), h, () => writeSave());
}

let customers = [];
function stockedSlots() { return S.shelves.map((s, i) => i).filter((i) => slotUnlocked(i) && S.shelves[i].item && S.shelves[i].qty > 0); }
function updateCustomers(dt) {

function spawnCustomer() {

function shelfStand(i) { const e = scenes.shop.ents.find((x) => x.id === "shelf" + i); return { x: e.tx * T + 8, y: (e.ty + 1) * T + 9 }; }
function stepCustomer(c, dt) {
  c.anim += dt;
  if (c.wait > 0) { c.wait -= dt; if (c.wait <= 0) customerNext(c); return; }
  const tgt = c.path[0]; if (!tgt) return customerNext(c);
  const dx = tgt.x - c.x, dy = tgt.y - c.y, d = Math.hypot(dx, dy), sp = 42 * dt;
  if (d <= sp) { c.x = tgt.x; c.y = tgt.y; c.path.shift(); if (!c.path.length) customerNext(c); return; }
  c.x += (dx / d) * sp; c.y += (dy / d) * sp;
  c.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");

    const pricey = has && tooExpensive(S.shelves[c.slot].price, ITEMS[S.shelves[c.slot].item].price);
    c.wishMet = Boolean(c.wish && has && !pricey && S.shelves[c.slot].item === c.wish);
    const ok = has && (c.wishMet || (!c.wish && willBuy(c.slot)));
    if (ok) { c.phase = "pay"; c.bubble = c.wishMet ? "♥" : null; c.path = [{ x: 8.5 * T, y: c.y }, { x: 8.5 * T, y: 4.9 * T }, { x: 12.5 * T, y: 4.9 * T }]; }
    else {
      c.phase = "out"; c.bubble = "?"; c.path = [{ x: 8.5 * T, y: c.y }, { x: 8.5 * T, y: 9.8 * T }, { x: 7.5 * T, y: 11.2 * T }];
      if (pricey) { c.bubble = "!"; say(c, "太貴了！", 2.5); toast(`顧客：「${ITEMS[S.shelves[c.slot].item].zh}太貴了，我不買！」`, "bad"); }

  for (let qi = 0; qi < q.length; qi++) {
    const cur = q[qi];
    if (goalSet.has(cur)) {
      const p = []; for (let c = cur; c !== -1; c = prev[c]) p.push(c);
      return p.reverse().slice(1).map((i) => ({ x: (i % W) * T + 8, y: Math.floor(i / W) * T + 12 }));
    }
    const x = cur % W, y = (cur / W) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy; if (!walkable(nx, ny)) continue;
      const ni = ny * W + nx; if (prev[ni] !== -2) continue; prev[ni] = cur; q.push(ni);
    }
  }
  return null;
}
function arrive() {
  const e = walkTarget; walkPath = null; walkTarget = null; player.moving = false;
  if (!e) return;
  const c = entCenter(e), dx = c.x - player.x, dy = c.y - (player.y - 6);
  player.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  currentTarget = e; interact(e);
}
cv.addEventListener("pointerdown", (ev) => {
  if (!S || !scene || paused()) return;
  Sound.init(); Sound.startMusic();
  const wx = ev.clientX / scale + cam.x, wy = ev.clientY / scale + cam.y;
  const tx = Math.floor(wx / T), ty = Math.floor(wy / T);
  if (raid && scene.name === "village") {
    const a = raid.animals.find((a) => a.delay <= 0 && a.state !== "flee" && Math.abs(a.x - wx) < 13 && wy - a.y < 6 && a.y - wy < 26);
    if (a) {
      const range = S.weapon ? WEAPONS[S.weapon].range : 22;
      if (Math.hypot(a.x - player.x, a.y - player.y) <= range + 6) { attackAnimal(a); return; }
      const ax = Math.floor(a.x / T), ay = Math.floor((a.y - 3) / T);
      const path = findPath([[ax, ay], [ax - 1, ay], [ax + 1, ay], [ax, ay - 1], [ax, ay + 1]]);
      if (path) { walkPath = path; walkTarget = null; walkStuck = 0; }
      return;
    }
  }
  let ent = null;
  for (const e of scene.ents) {
    if (!INTERACTIVE.has(e.type) || !entVisible(e)) continue;
    const top = e.ty - (e.type === "npc" || e.type === "shelf" || (e.type === "node" && (e.kind === "tree" || e.kind === "hive" || e.kind === "palm")) ? 1 : 0);
    if (tx >= e.tx && tx < e.tx + e.w && ty >= top && ty < e.ty + e.h) { ent = e; break; }
  }
  if (ent && ent === currentTarget) { interact(ent); return; }
  const path = findPath(ent ? adjacentGoals(ent) : [[tx, ty]]);
  if (!path) return;
  walkPath = path; walkTarget = ent; walkStuck = 0; tapMark = ent ? null : { x: tx, y: ty, t: 0 };
});

function updateHud() {
  const hh = $("hud").offsetHeight; if (hh && hh !== updateHud.hh) { updateHud.hh = hh; document.documentElement.style.setProperty("--hud-h", hh + 8 + "px"); }
  if (!S) return;
  $("hud-coins").textContent = S.coins;
  $("hud-time").textContent = timeLabel() + (shopOpen() ? "・營業中" : "・打烊");
  $("hud-bag").textContent = `背包 ${invCount()}/${capacity()}`;
  const ob = $("objective"); const txt = objectiveText(), hint = objectiveHint(), key = txt + "|" + hint;
  if (ob.dataset.t !== key) { ob.dataset.t = key; ob.innerHTML = `<small>目標</small>${esc(txt)}<span class="ob-hint">提示：${esc(hint)}</span>`; }
  $("alarm").hidden = !raid; ob.classList.toggle("raid", Boolean(raid));
  const a = $("btn-a"); a.classList.toggle("dim", !currentTarget);
  const lbl = targetLabel(currentTarget); if ($("btn-a-label").textContent !== lbl) $("btn-a-label").textContent = lbl;
}
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S && scene) { update(dt); render(); updateSpeeches(paused() ? 0 : dt); hudTimer += dt; if (hudTimer > 0.2) { hudTimer = 0; updateHud(); } }
  requestAnimationFrame(loop);
}

/* ---------------- 開始／登出 ---------------- */
function showGameUI(on) { for (const id of ["hud", "objective", "menu-btns", "joy-zone", "btn-a"]) $(id).hidden = !on; if (!on) { raid = null; $("alarm").hidden = true; for (const sp of speeches) sp.el.remove(); speeches.length = 0; } }
function startGame(save) {
  S = save;
  // 舊存檔補欄位
  const base = newSave(S.seat, S.look);
  for (const k of Object.keys(base)) if (S[k] === undefined) S[k] = base[k];
  for (const k of Object.keys(UPGRADES)) if (!S.up[k]) S.up[k] = 1;
  while (S.farm.length < FARM_PLOTS) S.farm.push({ c: null, g: 0, wet: false, dry: false });
  scenes.village = buildVillage(); scenes.forest = buildForest(); scenes.shop = buildShop(); scenes.beach = buildBeach(); scenes.mine = buildMine(); applyFlags();
  raid = null; speeches.length = 0; $("bubbles").innerHTML = "";
  ensureDaily();
  enterScene(S.scene in scenes ? S.scene : "village", S.x / T, S.y / T, S.dir);
  if (blocked(player.x, player.y)) { const sp = scene.spawn; player.x = sp.tx * T; player.y = sp.ty * T; }
  $("title").hidden = true; showGameUI(true); resize();
  Sound.init(); Sound.apply(); Sound.startMusic();
  writeSave();
  if (S.main.step === 0) {
    const go = () => setTimeout(() => toast("走到村長身邊（黃色箭頭），按右下角的按鈕說話", "gold"), 300);
    if (!S.flags.helpSeen) { S.flags.helpSeen = true; writeSave(); setTimeout(() => openHelp(0, go), 400); } else go();
  }
}
async function logout() {
  S.x = player.x; S.y = player.y; S.dir = player.dir; writeSave();
  if (cloudOn()) {
    openModal(`<h2>存檔中…</h2><p class="say">正在把進度存到雲端，請稍等。</p>`);
    const ok = await cloudSave();
    if (!ok && !confirm("沒辦法存到雲端（可能沒有網路）。\n進度仍保存在這台平板上，下次換平板會看不到。\n\n要繼續登出嗎？")) { closeModal(); return; }
  }
  closeModal(); S = null; scene = null; showGameUI(false); input.reset();
  $("title").hidden = false; $("seat").value = ""; renderSaves();
}
const seatKey = (n) => String(Number(n)).padStart(2, "0");
function nameOf(seat) { const st = STUDENTS.find(([n]) => seatKey(n) === seatKey(seat)); return st ? st[1] : `${Number(seat)} 號`; }
function renderNames() {
  $("names").innerHTML = STUDENTS.map(([n, name]) => {
    const sv = loadSave(seatKey(n));
    return `<button class="name-btn" data-seat="${n}">${esc(name)}<small>${sv ? `第 ${Math.floor(sv.min / DAY) + 1} 天・${sv.coins} 金` : `${n} 號・新冒險`}</small></button>`;
  }).join("");
  $("names").querySelectorAll("[data-seat]").forEach((b) => b.addEventListener("click", () => { $("seat").value = b.dataset.seat; begin(); }));
}
function renderSaves() {
  renderNames();
  const listed = new Set(STUDENTS.map(([n]) => seatKey(n)));
  const saves = listSaves().filter((s) => !listed.has(seatKey(s.seat)));
  $("saves").innerHTML = saves.length ? `<h4>這台平板上的存檔（點一下繼續玩）</h4><div class="save-grid">${saves.slice(0, 9).map((s) =>
    `<button class="save-chip" data-seat="${esc(s.seat)}"><b>${esc(nameOf(s.seat))}</b><span>第 ${Math.floor(s.min / DAY) + 1} 天・${s.coins} 金</span></button>`).join("")}</div>` : "";
  $("saves").querySelectorAll("[data-seat]").forEach((b) => b.addEventListener("click", () => { $("seat").value = b.dataset.seat; begin(); }));
}
let beginning = false;
async function begin() {
  Sound.init();
  if (beginning) return;
  const raw = $("seat").value.trim();
  if (!/^\d{1,2}$/.test(raw) || Number(raw) < 1) { $("title-err").textContent = "請輸入 1～99 的座號"; return; }
  $("title-err").textContent = "";
  const seat = String(Number(raw)).padStart(2, "0");
  const local = loadSave(seat);
  let cloud = null;
  if (cloudOn()) {
    beginning = true; $("start-btn").disabled = true; $("start-btn").textContent = "讀取存檔…";
    $("title-err").textContent = `正在讀取${nameOf(seat)}的存檔…`; document.querySelectorAll(".name-btn").forEach((b) => { b.disabled = true; });
    try { cloud = await cloudLoad(seat); }
    catch { $("title-err").textContent = "連不上雲端存檔，先使用這台平板上的進度"; await new Promise((r) => setTimeout(r, 1200)); }
    beginning = false; $("start-btn").disabled = false; $("start-btn").textContent = "開始冒險";
    $("title-err").textContent = ""; document.querySelectorAll(".name-btn").forEach((b) => { b.disabled = false; });
  }
  // 平板上的與雲端的存檔，用比較新的那一份
  const existing = [local, cloud].filter((s) => s && s.seat === seat).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))[0];
  if (existing) return startGame(existing);
  $("title").hidden = true;
  chooseLook(null, (look) => startGame(newSave(seat, look)));
}
$("start-btn").addEventListener("click", begin);
$("seat").addEventListener("keydown", (ev) => { if (ev.key === "Enter") begin(); });
$("fs-btn").addEventListener("click", toggleFullscreen);
const persist = () => { if (S && scene) { S.x = player.x; S.y = player.y; S.dir = player.dir; writeSave(); } };
document.addEventListener("visibilitychange", () => { if (document.hidden) { persist(); input.reset(); if (S && cloudDirty) cloudSave(true); } });
addEventListener("pagehide", () => { persist(); if (S && cloudDirty) cloudSave(true); });

/* ---------------- 標題插圖 ---------------- */
function drawTitleArt() {
  const t = $("title-art").getContext("2d"); t.imageSmoothingEnabled = false;
  const R = (x, y, c, w = 1, h = 1) => { t.fillStyle = c; t.fillRect(x, y, w, h); };
  const sky = t.createLinearGradient(0, 0, 0, 44); sky.addColorStop(0, "#6eb4ee"); sky.addColorStop(1, "#cfe9ff"); t.fillStyle = sky; t.fillRect(0, 0, 160, 64);
  for (const [x, y] of [[14, 9], [104, 5], [62, 13]]) { R(x, y, "#fff", 20, 4); R(x + 4, y - 3, "#fff", 11, 3); R(x + 2, y + 4, "#e4f2ff", 16, 1); }
  for (let x = 0; x < 160; x++) { const h = 40 - Math.round(5 * Math.sin(x / 17) + 3 * Math.sin(x / 6.5)); R(x, h, "#8ccf7a", 1, 64 - h); }
  for (let x = 0; x < 160; x += 16) t.drawImage(tileImgs[TILE.GRASS][(x / 16) % 4], x, 48);
  for (let x = 48; x < 112; x += 16) t.drawImage(tileImgs[TILE.PATH][0], x, 56);
  t.drawImage(tileImgs[TILE.TREE][0], 2, 34); t.drawImage(tileImgs[TILE.TREE][1], 16, 40); t.drawImage(tileImgs[TILE.TREE][0], 144, 36);
  // 小商店
  const bx = 52, bw = 56;
  for (let i = 0; i < 16; i++) { const inset = Math.max(0, 5 - Math.floor(i / 2)); R(bx - 4 + inset, 14 + i, i % 6 < 3 ? "#b04a3a" : "#7e2f24", bw + 8 - inset * 2, 1); }
  R(bx - 4, 29, "#2b1d14", bw + 8, 1);
  R(bx, 30, "#efe0c0", bw, 22); R(bx, 50, "#a08a68", bw, 2);
  R(bx + 6, 35, "#6b4226", 12, 10); R(bx + 7, 36, "#8ec5e8", 10, 8); R(bx + 38, 35, "#6b4226", 12, 10); R(bx + 39, 36, "#8ec5e8", 10, 8);
  R(bx + 22, 34, "#4a2c18", 12, 18); R(bx + 23, 35, "#8b5a2b", 10, 17); R(bx + 31, 43, "#e0c040", 1, 2);
  R(bx + 16, 22, "#5a3a20", 24, 8); R(bx + 17, 23, "#f4e9d0", 22, 6);
  let tx = bx + 20; for (const ch of "SHOP") { const m = MINI[ch]; for (let i = 0; i < 15; i++) if (m[i] === "1") R(tx + (i % 3), 24 + Math.floor(i / 3), "#5a2a10"); tx += 4; }
  // 角色
  t.drawImage(charSprite({ hair: "#e8e8e8", shirt: "#3f8a5a", pants: "#5a4a3a" }, "right", 0), 32, 41);
  t.drawImage(charSprite({ hair: "#6b3a1a", shirt: "#3a7ad0" }, "down", 0), 112, 42);
  t.drawImage(FOX, 128, 44);
  t.drawImage(ICONS.berry, 96, 50, 9, 9); t.drawImage(ICONS.wood, 44, 52, 9, 9); t.drawImage(ICONS.coin, 104, 50, 8, 8);
}

/* ---------------- 老師專區 ---------------- */
function sourceText() {
  const t = (ms) => (ms ? new Date(ms).toLocaleString() : "");
  if (wordSource.kind === "sheet") return `已讀取 Google 試算表（${t(wordSource.at)}）`;
  if (wordSource.kind === "cache") return `使用這台平板上次讀到的試算表單字（${t(wordSource.at)}）${wordSource.error ? `。這次讀取失敗：${wordSource.error}` : ""}`;
  return SHEET_URL ? `讀不到試算表，暫時使用內建的示範單字${wordSource.error ? `（${wordSource.error}）` : ""}` : "還沒連接 Google 試算表，目前使用內建的示範單字";
}
function updateWordStatus() {
  $("word-status").textContent = `單字：${wordSource.kind === "builtin" ? "示範單字" : "Google 試算表"}・本週 ${currentLabel()}・共 ${VOCAB.length} 個${wordSource.problems.length ? `・有 ${wordSource.problems.length} 個地方要修正（見老師專區）` : ""}`;
}
const csvCell = (s) => (/[",\r\n]/.test(s) ? `"${String(s).replace(/"/g, '""')}"` : s);
function downloadTemplate() {
  const lines = ["單元,英文,中文,本週", ...VOCAB.map((w) => [w.unit, w.en, w.zh, CURRENT_UNITS.has(w.unit) ? "V" : ""].map(csvCell).join(","))];
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "english-adventure-shop-單字範本.csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function openTeacher() {
  const units = [...new Set(VOCAB.map((w) => w.unit))];
  const unitRows = units.map((u) => `<tr><td>${esc(u)}${CURRENT_UNITS.has(u) ? " <b>（本週）</b>" : ""}</td><td>${VOCAB.filter((w) => w.unit === u).length} 個單字</td></tr>`).join("");
  const wordRows = VOCAB.map((w) => `<tr><td>${esc(w.unit)}</td><td>${esc(w.en)}</td><td>${esc(w.zh)}</td></tr>`).join("");
  const probs = wordSource.problems;
  openModal(`${closeBtn}<h2>老師專區</h2>
    <div class="row"><div class="grow"><div class="t">${esc(sourceText())}</div><div class="d">本週單元：${esc(currentLabel())}・共 ${VOCAB.length} 個單字</div></div></div>
    ${probs.length ? `<h3>需要修正</h3>${probs.map((p) => `<p class="problem">・${esc(p)}</p>`).join("")}` : `<p class="muted">單字檢查：沒有發現問題</p>`}
    <div class="btn-row" style="margin-top:10px"><button class="btn" data-act="reload" ${SHEET_URL ? "" : "disabled"}>重新讀取試算表</button><button class="btn alt" data-act="tpl">下載單字範本（CSV）</button></div>
    <h3>各單元</h3><table class="words">${unitRows}</table>
    <h3>用 Google 試算表管理單字（只需設定一次）</h3>
    <ol class="steps">
      <li>按上面的「下載單字範本」（或用遊戲旁邊的 english-adventure-shop-單字範本.csv）。</li>
      <li>打開 Google 試算表 → 建立空白試算表 → 檔案 → 匯入 → 上傳範本 →「取代目前的工作表」。</li>
      <li>A 欄單元、B 欄英文、C 欄中文；本週要練的單元，在 D 欄「本週」打 V。舊單元請留著，遊戲會拿來複習。</li>
      <li>右上角「共用」→ 一般存取權改成「知道連結的任何人」（檢視者）→ 複製連結。</li>
      <li>把連結交給 Claude 幫你設定（或用記事本貼到遊戲檔最上方的 SHEET_URL）。</li>
    </ol>
    <p class="muted">之後換單字只要改試算表，存檔後學生重新整理遊戲就會用新單字；沒有網路時，使用這台平板上次讀到的單字。注意：只有第一個分頁（連結中的那個工作表）會被讀取。</p>
    <h3>目前的單字</h3><table class="words"><tr><th>單元</th><th>英文</th><th>中文</th></tr>${wordRows}</table>`, {
    __closable: true,
    reload: async (el) => { el.disabled = true; el.textContent = "讀取中…"; await loadWords(true); updateWordStatus(); openTeacher(); },
    tpl: downloadTemplate,
  });
}
$("teacher-btn").addEventListener("click", () => { Sound.init(); openTeacher(); });

makeIcons(); makeTiles();
$("coin-ico").src = icon("coin");
drawTitleArt();
if (cloudOn()) $("save-note").textContent = "進度會自動存到雲端，換平板只要點自己的名字就能接著玩。";
loadWords().then(updateWordStatus);
updateWordStatus();
resize(); renderSaves();
if (!storageOK()) $("title-err").textContent = "注意：這個瀏覽器無法存檔（可能是私密瀏覽模式）";
requestAnimationFrame(loop);
</script>
